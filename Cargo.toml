[package]
name = "mismall" #short for "make it small"
version = "2.0.0"
edition = "2024"
rust-version = "1.85.0"
description = "Streaming Huffman compression library with AES-256-GCM encryption and archive support"
license = "MIT"
authors = ["Josiah Morris"]
repository = "https://github.com/gnik-snrub/make_it_small?branch=ai-library-transformation"
keywords = ["compression", "huffman", "encryption", "archive", "streaming"]
categories = ["compression", "cryptography"]

[features]
default = ["compression", "archives", "encryption"]
compression = []
archives = ["compression"]
encryption = []
async = []
cli = ["compression", "archives", "encryption", "clap", "indicatif", "console"]

[dependencies]
# Core dependencies - always included
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
aes-gcm = { version = "0.10", features = ["std"] }
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
typenum = "1.12"
tempfile = "3.2.0"

# CLI-only dependencies
clap = { version = "4.5.41", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }

# Optional error handling
thiserror = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "mismall"
required-features = ["cli"]

[[bench]]
name = "performance"
harness = false
